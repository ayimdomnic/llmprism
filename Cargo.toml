[package]
name = "llmprism"
version = "0.1.0"
edition = "2021"
description = "A unified, fluent Rust interface for integrating Large Language Model providers -- a Rust port of the PHP Prism library."
license = "MIT"
repository = "https://github.com/ayimdev/llmprism"
keywords = ["llm", "ai", "openai", "anthropic", "genai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
async-stream = "0.3"

reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false, optional = true }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"], optional = true }
reqwest-retry = { version = "0.7", optional = true }
eventsource-stream = { version = "0.2", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []
http = ["dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-retry", "dep:eventsource-stream"]
openai = ["http"]
anthropic = ["http"]

# The OpenAI-compatible provider family: each reuses `providers::openai`'s
# request/response handling against a different vendor's base URL, so
# enabling one of these implies "openai" the same way "openai" implies
# "http" -- you still only pay to compile in the providers you actually use.
groq = ["openai"]
deepseek = ["openai"]
mistral = ["openai"]
xai = ["openai"]
openrouter = ["openai"]
perplexity = ["openai"]
zai = ["openai"]
# Ollama also reuses "openai", but (unlike the family above) it's not part
# of `providers::openai_compatible` -- see that provider's own module docs.
ollama = ["openai"]

# Native providers -- each with its own wire format, so (unlike the
# OpenAI-compatible family above) these only need "http", not "openai".
voyageai = ["http"]
elevenlabs = ["http"]

full = [
    "openai",
    "anthropic",
    "groq",
    "deepseek",
    "mistral",
    "xai",
    "openrouter",
    "perplexity",
    "zai",
    "ollama",
    "voyageai",
    "elevenlabs",
]
