[package]
name = "llmprism"
version = "0.1.0"
edition = "2021"
description = "A unified, fluent Rust interface for integrating Large Language Model providers -- a Rust port of the PHP Prism library."
license = "MIT"
repository = "https://github.com/ayimdev/llmprism"
keywords = ["llm", "ai", "openai", "anthropic", "genai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false, optional = true }
reqwest-middleware = { version = "0.4", features = ["json"], optional = true }
reqwest-retry = { version = "0.7", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []
http = ["dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-retry"]
openai = ["http"]
