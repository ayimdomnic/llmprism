[package]
name = "llmprism-axum"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Soon To Zen <ayimdomnic@outlook.com>"]
description = "Axum routes for llmprism -- mount every capability as an HTTP API with one line."
license = "MIT"
repository = "https://github.com/ayimdomnic/llmprism"
# This crate's own README (not the workspace root's) -- its crates.io/docs.rs
# page should lead with an Axum-specific quick start and route table, not the
# provider-focused content the root README leads with.
readme = "README.md"
keywords = ["llm", "ai", "axum", "http", "api"]
categories = ["api-bindings", "asynchronous", "web-programming::http-server"]

[dependencies]
# No features enabled on purpose -- this crate only touches `Registry` and
# request/response types, none of which need a provider feature. A consumer's
# own direct `llmprism` dependency (with whichever provider features they
# enable) unifies with this one via Cargo's normal feature resolution.
#
# `version` here has to track whatever llmprism actually is locally, not just
# what this crate happens to use: Cargo enforces a path dependency's
# `version` requirement even against the local path build (not just once
# published), so *any* llmprism version bump breaks every sibling crate's
# build until its own `version` req is updated too -- independent of whether
# that sibling itself has anything new to say. Bump this every time
# crates/llmprism/Cargo.toml's version changes, before running
# scripts/release.sh for either crate.
llmprism = { path = "../llmprism", version = "0.4" }
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encodes/decodes the audio routes' base64 payloads -- see `src/audio.rs`
# for why base64-in-JSON, not multipart, is this crate's answer to the
# binary-body design question ROADMAP.md's Phase 1 deferred.
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
