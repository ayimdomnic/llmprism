[package]
name = "llmprism"
version = "0.3.0"
edition = "2021"
# Not just this crate's own floor (1.65, for `let-else`) -- the `full`
# dependency tree's highest self-declared `rust-version` is what actually
# gates a build, and that comes from the icu_*/idna_adapter crates reqwest
# pulls in for internationalized domain name support (checked via
# `cargo metadata --format-version 1 --features full`, sorted by
# `rust_version`). Re-check that command if bumping dependencies ever lowers
# or raises this.
rust-version = "1.88"
authors = ["Soon To Zen <ayimdomnic@outlook.com>"]
description = "A unified, fluent Rust interface for integrating Large Language Model providers -- a Rust port of the PHP Prism library."
license = "MIT"
repository = "https://github.com/ayimdomnic/llmprism"
# Points outside this crate's own directory, at the single README shared by
# the whole workspace (there's only one member today, but this is written to
# keep working once there's more than one) -- Cargo follows a `readme` path
# like this fine when packaging, even though it isn't under the crate root.
readme = "../../README.md"
keywords = ["llm", "ai", "openai", "anthropic", "genai"]
categories = ["api-bindings", "asynchronous"]

# Nothing is enabled by default (see the crate root docs), but the published
# docs.rs page should show every provider, not an empty crate -- otherwise
# the first thing anyone evaluating this crate sees is a page with almost
# nothing on it.
[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
async-stream = "0.3"

reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false, optional = true }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"], optional = true }
reqwest-retry = { version = "0.7", optional = true }
eventsource-stream = { version = "0.2", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
partial-json-fixer = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = "0.3"
wiremock = "0.6"

[features]
default = []
http = ["dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-retry", "dep:eventsource-stream", "dep:partial-json-fixer"]
openai = ["http"]
anthropic = ["http"]

# The OpenAI-compatible provider family: each reuses `providers::openai`'s
# request/response handling against a different vendor's base URL, so
# enabling one of these implies "openai" the same way "openai" implies
# "http" -- you still only pay to compile in the providers you actually use.
groq = ["openai"]
deepseek = ["openai"]
mistral = ["openai"]
xai = ["openai"]
openrouter = ["openai"]
perplexity = ["openai"]
zai = ["openai"]
# Ollama also reuses "openai", but (unlike the family above) it's not part
# of `providers::openai_compatible` -- see that provider's own module docs.
ollama = ["openai"]

# Native providers -- each with its own wire format, so (unlike the
# OpenAI-compatible family above) these only need "http", not "openai".
voyageai = ["http"]
elevenlabs = ["http"]
gemini = ["http"]

# Capability add-ons -- not providers, so deliberately not part of "full"
# (whose own doc comment scopes it to providers). Combine explicitly with
# whichever providers you're using, e.g. `--features tracing,openai`.
tracing = ["dep:tracing"]
# `rmcp`'s HTTP transport (client-side-sse) pulls in its own reqwest 0.13,
# independent of this crate's own reqwest 0.12 (behind "http") -- both can
# coexist in one build, at the cost of compiling reqwest twice when "mcp" is
# combined with any provider feature. Not worth avoiding: rmcp doesn't offer
# a way to reuse an external HTTP client for its transport.
mcp = ["dep:rmcp"]
# Implies "http" (not any specific provider) since `Registry::from_env()`,
# which the CLI is a thin wrapper around, needs it -- pair with whichever
# provider features you actually want, e.g. `--features cli,openai,anthropic`.
cli = ["dep:clap", "http"]

full = [
    "openai",
    "anthropic",
    "groq",
    "deepseek",
    "mistral",
    "xai",
    "openrouter",
    "perplexity",
    "zai",
    "ollama",
    "voyageai",
    "elevenlabs",
    "gemini",
]

[[bin]]
name = "llmprism"
path = "src/bin/llmprism.rs"
required-features = ["cli"]

# Every bench below sets `harness = false` since criterion provides its own
# `main`. `tool_loop` and `middleware` need no feature at all -- `Registry`,
# `FakeProvider`, and `ProviderMiddleware` are unconditional -- but
# `provider_options` benchmarks `client::merge_provider_options`, which only
# exists behind `http`, so `cargo bench` needs at least `--features openai`
# (or any other feature that implies `http`) to build that one.
[[bench]]
name = "schema"
harness = false

[[bench]]
name = "tool_loop"
harness = false

[[bench]]
name = "stream_loop"
harness = false

[[bench]]
name = "middleware"
harness = false

[[bench]]
name = "provider_options"
harness = false
required-features = ["http"]
